[package]
name = "pomosport"
version = "0.1.0"
edition = "2021"
description = "Pomodoro timer TUI with an exercise wheel for macOS"
license = "MIT"
repository = "https://github.com/mobewb/pomosport-app"
readme = "README.md"
rust-version = "1.96"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
dirs = "7.0.0"
serde_json = "1.0.151"
libc = "0.2.190"
